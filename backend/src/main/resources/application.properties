spring.application.name=booking-backend

# Not 8080/8081, so this demo can run alongside sibling demo apps.
server.port=8082

# Local embedded database. The path is relative to the directory the backend is
# started from (backend/), so data lives in backend/data/ unless BOOKING_DATA_DIR is set.
spring.datasource.url=jdbc:h2:file:${BOOKING_DATA_DIR:./data}/booking;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

spring.mvc.problemdetails.enabled=true

# The single fictional venue. All booking rules use this timezone and these hours.
venue.name=Larkspur House (fictional)
venue.zone=Europe/London
venue.opens-at=08:00
venue.closes-at=20:00
venue.slot-minutes=15
venue.booking-horizon-days=90
